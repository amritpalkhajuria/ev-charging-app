services:
  app:
    container_name: ev-charging-app
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db

  # Local MySQL for development; production used Azure Database for MySQL
  db:
    image: mysql:8
    container_name: ev-charging-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
